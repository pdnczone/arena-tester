# Linux only: host networking avoids Docker NAT limits at thousands of connections.
services:
  arena:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      DASH_PASSWORD: ${DASH_PASSWORD:?set DASH_PASSWORD in .env}
      PORT: 8080
    volumes:
      - ./data:/app/data
    ulimits:
      nofile: { soft: 1048576, hard: 1048576 }
